name: Deploy to Vercel

# Runs on every push to main. `verify` gates `deploy` — a broken build or
# a failing test never reaches production. See TESTING.md for what these
# checks do (and don't) cover; this is npm run verify's lint+test half —
# the actual production build happens in the deploy job below, via
# `vercel build`, not `next build` directly.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    name: Build & deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Fetches this project's Vercel config (framework detection, build
      # settings) using the org/project this repo is linked to.
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # GitHub Secrets are the single source of truth for the app's own
      # env vars — nothing needs to be separately configured in Vercel's
      # dashboard. This writes them straight into the file `vercel build`
      # reads: NEXT_PUBLIC_* get inlined into the client bundle, and
      # (this is the part that actually matters) `vercel build` also bakes
      # this file's values into the deployed function's own runtime
      # config — which is what makes a runtime-only value like
      # SUPABASE_SERVICE_ROLE_KEY (see lib/supabase/service.ts) actually
      # reach the deployed function, not just the build step.
      - name: Write app env vars from GitHub Secrets
        run: |
          cat > .env.production.local <<EOF
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
