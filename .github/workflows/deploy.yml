name: Deploy to Vercel

# Runs on every push to main. `verify` gates `deploy` — a broken build or
# a failing test never reaches production. See TESTING.md for what these
# checks do (and don't) cover; this is npm run verify's lint+test half —
# the actual production build happens in the deploy job below, via
# `vercel build`, not `next build` directly.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    name: Build & deploy to Vercel
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Fetches this project's Vercel config AND its Environment Variables
      # (NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,
      # SUPABASE_SERVICE_ROLE_KEY) from Vercel's own dashboard — Project →
      # Settings → Environment Variables is the actual source of truth for
      # anything the running app reads, at build time OR at request time.
      # GitHub Secrets alone can't supply a runtime-only value like
      # SUPABASE_SERVICE_ROLE_KEY (see lib/supabase/service.ts) — a value
      # only present in *this workflow's* shell during `vercel build` never
      # reaches the deployed function's own runtime environment. It has to
      # be set on the Vercel project itself, which is what this step reads.
      - name: Pull Vercel project settings + env vars
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
