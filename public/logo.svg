<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" role="img" aria-labelledby="dj-logo-title">
  <title id="dj-logo-title">Deals Junction — Shop smart. Save big.</title>
  <defs>
    <style>
      .brand-text { font-family: 'Poppins', system-ui, sans-serif; font-weight: 700; font-size: 40px; fill: #222831; }
      .brand-accent { fill: #FD7014; }
      .slogan-text { font-family: 'Inter', system-ui, sans-serif; font-weight: 600; font-size: 12px; fill: #6B7280; letter-spacing: 0.2em; }
      .cart-body { fill: none; stroke: #222831; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .cart-mesh { fill: none; stroke: #222831; stroke-width: 3.5; stroke-linecap: round; }
      .cart-wheel { fill: #222831; }
      .cart-wheel-rim { fill: #FD7014; }
    </style>
  </defs>
  <g transform="translate(15, 18)">
    <path d="M0 8 L18 8 L32 58 L85 58 L98 20 L22 20" class="cart-body" />
    <line x1="38" y1="20" x2="44" y2="58" class="cart-mesh" />
    <line x1="56" y1="20" x2="59" y2="58" class="cart-mesh" />
    <line x1="74" y1="20" x2="74" y2="58" class="cart-mesh" />
    <line x1="28" y1="38" x2="92" y2="38" class="cart-mesh" />
    <circle cx="40" cy="74" r="10" class="cart-wheel" />
    <circle cx="40" cy="74" r="4.5" class="cart-wheel-rim" />
    <circle cx="78" cy="74" r="10" class="cart-wheel" />
    <circle cx="78" cy="74" r="4.5" class="cart-wheel-rim" />
  </g>
  <text x="135" y="60" class="brand-text">Deals <tspan class="brand-accent">Junction</tspan></text>
  <text x="137" y="86" class="slogan-text">SHOP SMART. SAVE BIG.</text>
</svg>
